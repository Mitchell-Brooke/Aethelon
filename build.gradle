def libsDir = file('libs')
def embeddedJars = sharedMods.collect { m -> file("libs/${m.output}") }

// Dev-runtime-only helpers: the nested (jar-in-jar) mods and libraries that
// Fabric Loader's JIJ resolution pulls automatically from a mods-folder install,
// but which the dev classpath (runClient) cannot load from inside a classpath
// dependency. Every nested jar of every embedded mod is extracted to devlibs so
// the dev runtime matches production. Not embedded and not committed.
def devLibsDir = file('devlibs')
devLibsDir.mkdirs()
def devExtractNested = { File source, File destDir ->
    if (!source.exists()) {
        return
    }
    def zip = new java.util.zip.ZipFile(source)
    try {
        zip.entries().each { entry ->
            if (entry.name.startsWith('META-INF/jars/') && entry.name.endsWith('.jar')) {
                def out = new File(destDir, entry.name.substring('META-INF/jars/'.length()))
                if (!out.exists()) {
                    zip.getInputStream(entry).withCloseable { ins ->
                        out.withOutputStream { os -> ins.transferTo(os) }
                    }
                }
            }
        }
    } finally {
        zip.close()
    }
}
embeddedJars.each { lib -> devExtractNested(lib, devLibsDir) }
// c2me's native-math optional module requires Java >= 22; dev uses the
// configured Java 21 toolchain, so it is left out of the dev runtime only.
def devOnlyJars = (devLibsDir.listFiles() ?: []).findAll {
    it.name != 'c2me-opts-natives-math-mc1.21.11-0.3.6.0.0.jar'
}

def devRuntimeJars = embeddedJars + devOnlyJars

def download = { File target, String url ->
    def conn = new URL(url).openConnection()
    conn.connectTimeout = 30_000
    conn.readTimeout = 120_000
    conn.setRequestProperty('User-Agent', 'aethelon/0.1.0 (build script)')
    conn.connect()
    target.withOutputStream { os ->
        conn.inputStream.withCloseable { ins -> ins.transferTo(os) }
    }
}

def sha512 = { File f ->
    def md = MessageDigest.getInstance('SHA-512')
    f.eachByte(8192) { buf, n -> md.update(buf, 0, n) }
    md.digest().collect { String.format('%02x', it) }.join('')
}

// Loom inspects (and checksums) file-based mod dependencies during the
// configuration phase, so the pinned jars must already exist by then. Download
// and verify them here, at configuration time, instead of in a lazy task.
sharedMods.each { m ->
    def out = file("libs/${m.output}")
    if (out.exists() && sha512(out).equalsIgnoreCase(m.sha512)) {
        return
    }
    libsDir.mkdirs()
    logger.lifecycle("[aethelon] Fetching ${m.output} ...")
    download(out, m.url)
    def check = sha512(out)
    if (!check.equalsIgnoreCase(m.sha512)) {
        out.delete()
        throw new GradleException("SHA-512 mismatch for ${m.output}: expected ${m.sha512}, got ${check}")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Third-party mods: on the dev runtime classpath, and nested into the final
    // jar (META-INF/jars) so a single install works. Fabric Loader loads every
    // jar found under META-INF/jars automatically.
    devRuntimeJars.each { lib ->
        modRuntimeOnly files(lib)
    }
}

// Nest the pinned mods inside the produced mod jar as jar-in-jar.
jar {
    from(libsDir) {
        include('*.jar')
        into('META-INF/jars')
    }
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}